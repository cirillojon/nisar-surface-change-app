# fly.toml app configuration file generated for nisar-surface-change-app-future on 2026-11-23T04:02:15Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'nisar-surface-change-app-future'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'immediate'

[env]
  FLASK_ENV = 'production'
  FLASK_PORT = '8880'
  GUNICORN_TIMEOUT = '90'
  LOG_LEVEL = 'INFO'
  RATELIMIT_STORAGE_URI = 'memory://'
  RUN_INPROC_WORKER = '0'
  WEB_CONCURRENCY = '4'

[processes]
  app = 'prod'

[[mounts]]
  source = 'app_data'
  destination = '/app/app-data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 100

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '3m0s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
