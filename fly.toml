# Fly.io config for the NISAR Surface Change backend.
# First-time setup is in docs/DEPLOYMENT.md. After that, every push to
# main that touches the backend deploys via .github/workflows/fly-deploy.yml.

app = 'nisar-surface-change'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  # One machine + a mounted volume can't do a rolling swap (a Fly volume
  # can't be mounted twice), so stop the old machine and start the new one.
  # Expect a ~10-30 s cutover while migrations run and gunicorn boots.
  strategy = 'immediate'

[env]
  FLASK_ENV = 'production'
  FLASK_PORT = '8880'
  LOG_LEVEL = 'INFO'
  WEB_CONCURRENCY = '4'
  # Rendering an uncached SME2 granule takes ~10 s; leave headroom.
  GUNICORN_TIMEOUT = '90'
  # Site data ships in the image and is loaded on every boot, so the
  # periodic in-process reload loop isn't needed.
  RUN_INPROC_WORKER = '0'
  RATELIMIT_STORAGE_URI = 'memory://'

[processes]
  # Appended as ARGS to the Dockerfile ENTRYPOINT (/app/bin/start).
  # Don't prefix with `bin/start`.
  app = 'prod'

[[mounts]]
  # SQLite DB + SME2/DEM/profile render caches
  source = 'app_data'
  destination = '/app/app-data'

[http_service]
  internal_port = 8880
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 100

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '3m0s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
