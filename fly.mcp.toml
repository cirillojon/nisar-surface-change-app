# Fly.io config for the NISAR MCP server (streamable HTTP at /mcp).
# Separate app from the backend (fly.toml). Deploy with:
#   fly deploy --config fly.mcp.toml --dockerfile Dockerfile.mcp

app = 'nisar-mcp'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile.mcp'

[env]
  NISAR_API_URL = 'https://nisar-surface-change.fly.dev'
  NISAR_API_TIMEOUT = '120'

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
