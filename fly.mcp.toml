# fly.toml app configuration file generated for nisar-mcp on 2026-11-15T22:53:24-05:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'nisar-mcp'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile.mcp'

[env]
  NISAR_API_TIMEOUT = '120'
  NISAR_API_URL = 'https://nisar-surface-change.fly.dev'

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
