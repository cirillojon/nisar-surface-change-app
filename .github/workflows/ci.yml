name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Schema drift check
        # Fails CI if models.py changed without a matching migration.
        # NOTE: must use a file-backed sqlite, not :memory: — flask spins
        # up a fresh connection per CLI invocation, and each :memory: URL
        # gets its own private DB, so check-schema would see an empty DB
        # and report every modeled table as "drift".
        env:
          FLASK_APP: app.py
          FLASK_ENV: development
          SQLALCHEMY_DATABASE_URI: "sqlite:////tmp/ci-schema-check.db"
        run: |
          rm -f /tmp/ci-schema-check.db
          flask db upgrade
          flask nisar check-schema
      - name: Run pytest
        env:
          FLASK_ENV: development
        run: |
          pytest tests/ \
            -v --tb=short --color=yes \
            --junitxml=pytest-results.xml

      - name: Publish backend test summary
        if: always() && hashFiles('pytest-results.xml') != ''
        uses: test-summary/action@v2
        with:
          paths: pytest-results.xml

      - name: Upload backend test results
        if: always() && hashFiles('pytest-results.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          retention-days: 14

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        # Don't fail CI on existing lint warnings; surface errors only.
        run: npm run lint || true
      - name: Run tests
        env:
          # Tells vite.config.js to also emit a JUnit XML report.
          VITEST_JUNIT: "1"
        run: npx vitest run

      - name: Publish frontend test summary
        if: always() && hashFiles('frontend/vitest-results.xml') != ''
        uses: test-summary/action@v2
        with:
          paths: frontend/vitest-results.xml

      - name: Upload frontend test results
        if: always() && hashFiles('frontend/vitest-results.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: frontend/vitest-results.xml
          retention-days: 14
      - name: Build
        run: npm run build
