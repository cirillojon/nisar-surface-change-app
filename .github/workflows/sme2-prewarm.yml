name: SME2 Prewarm

# Renders new SME2 (soil moisture) passes on the Fly machine so the map
# shows them instantly. Cached granules are skipped, so daily runs only
# render what NASA published since the last run. Needs the
# EARTHDATA_TOKEN Fly secret.

on:
  schedule:
    - cron: "0 10 * * *" # daily, 10:00 UTC
  workflow_dispatch:
    inputs:
      region:
        description: "Region id from app/data/regions.json"
        default: "washington-box"
        required: true

concurrency:
  group: sme2-prewarm
  cancel-in-progress: false

jobs:
  prewarm:
    name: Prewarm SME2 cache
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check Fly token
        id: check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::FLY_API_TOKEN not set; skipping."
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.enabled == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.enabled == 'true'
      - name: Run sme2-prewarm on the machine
        if: steps.check.outputs.enabled == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          REGION: ${{ inputs.region || 'washington-box' }}
        # Runs as the `app` user so cached files stay writable by gunicorn.
        # 2 workers keeps memory in check next to the web server.
        run: |
          [[ "$REGION" =~ ^[a-z0-9-]+$ ]] || { echo "::error::bad region id"; exit 1; }
          flyctl ssh console -C "su app -s /bin/bash -c 'cd /app && flask nisar sme2-prewarm --region $REGION --workers 2'"
