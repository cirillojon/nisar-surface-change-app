name: SME2 Prewarm

# Renders new SME2 (soil moisture) passes on the Fly machine so the map
# shows them instantly. Cached granules are skipped, so daily runs only
# render what NASA published since the last run. Needs the
# EARTHDATA_TOKEN Fly secret. Runs for production and, while its token is
# set, the `future` staging app (each has its own volume and cache).

on:
  schedule:
    - cron: "0 10 * * *" # daily, 10:00 UTC
  workflow_dispatch:
    inputs:
      region:
        description: "Region id from app/data/regions.json"
        default: "washington-box"
        required: true

jobs:
  prewarm:
    name: Prewarm SME2 cache (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: sme2-prewarm-${{ matrix.app }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: nisar-surface-change
            token: FLY_API_TOKEN
          - app: nisar-surface-change-app-future
            token: FLY_API_TOKEN_FUTURE
    steps:
      - name: Check Fly token
        id: check
        env:
          FLY_API_TOKEN: ${{ secrets[matrix.token] }}
          TOKEN_NAME: ${{ matrix.token }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TOKEN_NAME not set; skipping."
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.enabled == 'true'
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.check.outputs.enabled == 'true'
      - name: Run sme2-prewarm on the machine
        if: steps.check.outputs.enabled == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets[matrix.token] }}
          APP: ${{ matrix.app }}
          REGION: ${{ inputs.region || 'washington-box' }}
        # Runs as the `app` user so cached files stay writable by gunicorn.
        # 2 workers keeps memory in check next to the web server.
        run: |
          [[ "$REGION" =~ ^[a-z0-9-]+$ ]] || { echo "::error::bad region id"; exit 1; }
          flyctl ssh console -a "$APP" -C "su app -s /bin/bash -c 'cd /app && flask nisar sme2-prewarm --region $REGION --workers 2'"
